<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>Snowball · M5Stack</title><link rel="stylesheet" href="m5stack-setup.css"></head>
<body><main>
<header><div><span class="brand">SNOWBALL / DEVICE SETUP</span><h1 id="heading">M5Stack 설정</h1><p id="subtitle"></p></div><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select></header>
<nav id="journey" aria-label="Setup steps"></nav>
<p id="notice" role="status" aria-live="polite"></p>
<section class="card"><div class="row"><h2 id="usb-title"></h2><button id="refresh" class="secondary"></button></div><div id="devices"></div></section>
<section class="card"><h2 id="release-title"></h2><ul id="changes"></ul><p id="scope" class="muted"></p></section>
<section class="card"><div class="row"><h2 id="wifi-title"></h2><button id="read-wifi" class="secondary"></button></div><p id="network"></p><p id="wifi-boundary" class="muted"></p></section>
<section class="card"><h2 id="guide-title"></h2><div class="guide">
<div><svg viewBox="0 0 310 230" role="img" aria-label="M5Stack and three physical buttons"><rect x="25" y="8" width="260" height="210" rx="22" fill="#252b33" stroke="#636d7b" stroke-width="3"/><rect x="43" y="26" width="224" height="139" rx="6" fill="#10151c"/><text x="59" y="55" fill="#a3e17d" font-size="17">Settings / 설정</text><rect x="54" y="67" width="202" height="31" rx="4" fill="#a3e17d"/><text x="62" y="88" fill="#10151c" font-size="15">Wi-Fi / Wi-Fi 설정</text><text x="61" y="124" fill="#a0aab8" font-size="13">↑ ↓  /  Enter</text><g fill="#434e5c"><rect x="52" y="181" width="53" height="23" rx="6"/><rect x="128" y="181" width="53" height="23" rx="6"/><rect x="204" y="181" width="53" height="23" rx="6"/></g><g fill="#eef1f4" font-size="14" text-anchor="middle"><text x="78" y="198">A ↑</text><text x="154" y="198">B ↵</text><text x="230" y="198">C ↓</text></g></svg><p id="guide-caption" class="muted"></p></div>
<ol id="guide-steps"></ol></div><p id="faces-note" class="muted"></p></section>
</main><script src="m5stack-setup.js"></script></body></html>
