<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>Snowball · Device setup</title><link rel="stylesheet" href="device-setup.css"></head>
<body><main>
<header><div><span class="brand">SNOWBALL / DEVICE SETUP</span><h1 id="heading">기기 설정</h1><p id="subtitle"></p></div><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select></header>
<label class="row"><span id="profile-label"></span><select id="profile" aria-label="Device type"></select></label>
<nav id="journey" aria-label="Setup steps"></nav>
<p id="notice" role="status" aria-live="polite"></p>
<section class="card"><div class="row"><h2 id="usb-title"></h2><button id="refresh" class="secondary"></button></div><div id="devices"></div></section>
<section class="card"><h2 id="release-title"></h2><ul id="changes"></ul><p id="scope" class="muted"></p></section>
<section class="card" id="wifi-section"><div class="row"><h2 id="wifi-title"></h2><button id="read-wifi" class="secondary"></button></div><p id="network"></p><p id="wifi-boundary" class="muted"></p></section>
<section class="card"><h2 id="guide-title"></h2><div class="guide">
<div><svg id="device-diagram" viewBox="0 0 310 230" role="img"></svg><p id="guide-caption" class="muted"></p></div>
<ol id="guide-steps"></ol></div><p id="faces-note" class="muted"></p></section>
</main><script src="device-setup.js"></script></body></html>
